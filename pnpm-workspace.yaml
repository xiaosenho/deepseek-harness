packages:
  # The desktop shell is the project's own package.
  - electron
  # Fork-only Web packages shipped with the shell (never upstream).
  - electron/vendor/*
  # The Web kernel lives in the deepseek-harness-web submodule (pinned upstream).
  # Its packages join this workspace for DEPENDENCY RESOLUTION only, so
  # `workspace:^` references from the shell and vendor packages resolve to the
  # pinned upstream sources; the kernel itself builds inside the submodule.
  - deepseek-harness-web/vendor/*
  - deepseek-harness-web/packages/*/*
  - deepseek-harness-web/native/landlock-run
  - deepseek-harness-web/native/landlock-run/packages/*
  - deepseek-harness-web/apps/*
  - deepseek-harness-web/website
  - deepseek-harness-web/examples

# Vendored framework packages keep their upstream semver ranges, while local
# builds must resolve those matching names to this workspace's pinned sources.
linkWorkspacePackages: true

# Install the optional native binaries needed to cross-package Windows x64 from macOS.
supportedArchitectures:
  os:
    - current
    - win32
  cpu:
    - current
    - x64
  libc:
    - current

overrides:
  '@deepseek-ai/cosmokit': 'link:deepseek-harness-web/vendor/cosmokit'
  '@deepseek-ai/schemastery': 'link:deepseek-harness-web/vendor/schemastery'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

# pnpm 10+ blocks any dependency shipping an install/build script until it is
# explicitly reviewed here (strictDepBuilds defaults to true: an unlisted script
# is a hard install error). Every such package MUST be listed; we deny by
# default and only allow scripts we need. esbuild (native binary) and lefthook
# (git hooks) genuinely need theirs.
allowBuilds:
  # Electron's install script downloads the reviewed platform runtime used by electron/.
  electron: true
  # The Windows installer selects the vendored 7-Zip executable for the current architecture.
  electron-winstaller: true
  esbuild: true
  lefthook: true
  # Cross-platform boundary for the persistent PTY backend, including ConPTY on Windows.
  node-pty: true
  # Pulled in by @earendil-works/pi-ai (optional LLM API backend). pnpm lists
  # them only because they ship lifecycle scripts, but those are no-ops we don't
  # need, so we deny them — install still succeeds.
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false
  # JSONL durability calls MoveFileExW with write-through publication on Windows.
  koffi: true
  # The Web kernel's workspace postinstall restores the executable bit on
  # node-pty's macOS spawn helper when the kernel closure is installed here.
  '@deepseek-ai/dsh-subprocess-local@file:deepseek-harness-web/packages/subprocess/subprocess-local': true
minimumReleaseAgeExclude:
  # Fresh pi-ai releases carry the model catalog updates that are the whole
  # point of bumping it; waiting out the release age would defeat that.
  - '@earendil-works/pi-ai@0.82.1'
  - node-addon-native-custom-loader@0.1.4
  - node-addon-require-builtin-darwin-arm64@0.1.4
  - node-addon-require-builtin-darwin-x64@0.1.4
  - node-addon-require-builtin-linux-arm64-gnu@0.1.4
  - node-addon-require-builtin-linux-x64-gnu@0.1.4
  - node-addon-require-builtin-win32-arm64-msvc@0.1.4
  - node-addon-require-builtin-win32-ia32-msvc@0.1.4
  - node-addon-require-builtin-win32-x64-msvc@0.1.4
  - node-addon-require-builtin@0.1.4

patchedDependencies:
  node-pty@1.1.0: patches/node-pty@1.1.0.patch
