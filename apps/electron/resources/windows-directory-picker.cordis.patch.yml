# Electron's Node-mode child can terminate inside the Koffi/COM worker before
# the worker protocol reports a result. Pin the complete browse interaction on
# Windows so the packaged desktop application does not depend on that worker.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
