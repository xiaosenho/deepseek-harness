# The local Electron page uses a native dialog owned by the desktop process;
# authenticated LAN clients keep the in-app browser. The provider's private
# IPC channel exists only between this app and its owned WebUI child.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-electron
      name: '@deepseek-ai/dsh-host-directory-picker-electron'
    - id: ui-directory-picker-electron
      name: '@deepseek-ai/dsh-client-ui-directory-picker-electron'
